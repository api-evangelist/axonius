aid: axonius
name: Axonius
description: >-
  Axonius is a cybersecurity asset management platform (Axonius Asset Cloud) that aggregates
  device, user, cloud, SaaS and vulnerability data from 800+ adapters into one correlated
  inventory, enforces security policies through automated enforcement actions and workflows,
  and exposes that inventory over a service-account REST API (API v2), an Axonius Query
  Language, a deprecated Python client and CLI, outbound webhooks, and an early-access MCP server.
