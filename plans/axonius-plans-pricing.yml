description: >-
  Axonius publishes no pricing page — https://www.axonius.com/pricing returns 404 and the site
  footer links no pricing — and sells through sales conversations and private offers. The only
  provider-published list prices are the two public dimensions on its own AWS Marketplace listing
  (seller: Axonius Inc.), recorded here verbatim. Pricing is per asset (or per SaaS user for the
  SaaS Management module) on 12-month contracts; there is no free tier, no trial, no self-serve
  signup, and the API is not priced separately — it is part of the platform subscription. This
  file replaces a 2026-05-04 scaffold that carried invented free/professional/enterprise tiers.
plan_count: 2
pricing_page: null
pricing_model: per-asset annual subscription, quote-based; public list prices only on AWS Marketplace
free_tier: false
