description: >-
  Axonius publishes no rate limits for its REST API on any public page: the REST API overview,
  the service-account and advanced-API-settings pages and the full docs index
  (https://docs.axonius.com/llms.txt, 2,866 pages) contain no rate-limit, throttling or 429
  guidance, and the API v2 reference where such limits would be stated is login-gated at
  developer.axonius.com. Recorded as an honest zero. This file replaces a 2026-05-04 scaffold
  that carried invented per-tier limits.
